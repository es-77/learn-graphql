"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query {
    # Authentication and Authorization
    me: User! @auth
    adminDashboard: Dashboard! @auth @can(ability: "view-admin-dashboard")
    
    # Caching
    popularPosts: [Post!]! @cache(maxAge: 3600)
    userStats(userId: ID!): Stats! @cache(key: "user_{userId}")
    
    # Pagination
    posts: [Post!]! @paginate(type: "paginator")
    comments: [Comment!]! @paginate(type: "connection")
    
    # Filtering and Searching
    searchPosts(query: String!): [Post!]! @search
    activeUsers: [User!]! @where(column: "status", operator: "=", value: "active")
    
    # Relationships
    userPosts(userId: ID!): [Post!]! @belongsToMany
    postComments(postId: ID!): [Comment!]! @hasMany

    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)
}

"Account of a person who utilizes this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String! @hide

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime! @rename(attribute: "created_at")

    "When the account was last updated."
    updated_at: DateTime!

    posts: [Post!]! @hasMany
    comments: [Comment!]! @hasMany
}

type Mutation {
    # Authentication
    login(email: String!, password: String!): AuthPayload! @field(resolver: "Auth@login")
    
    # Data Manipulation
    createPost(input: CreatePostInput!): Post! @create
    updatePost(id: ID!, input: UpdatePostInput!): Post! @update
    deletePost(id: ID!): Post! @delete
    
    # Validation
    register(input: RegisterInput!): User! @rules(apply: ["required", "email", "min:8"])
}

type Post {
    id: ID!
    title: String!
    content: String!
    author: User! @belongsTo
    comments: [Comment!]! @hasMany
    tags: [Tag!]! @belongsToMany
    created_at: DateTime! @rename(attribute: "created_at")
}

type Comment {
    id: ID!
    content: String!
    author: User! @belongsTo
    post: Post! @belongsTo
    created_at: DateTime! @rename(attribute: "created_at")
}

type Tag {
    id: ID!
    name: String!
    posts: [Post!]! @belongsToMany
}

type Stats {
    totalPosts: Int!
    totalComments: Int!
    lastActive: DateTime!
}

type Dashboard {
    totalUsers: Int!
    totalPosts: Int!
    recentActivity: [Activity!]!
}

type Activity {
    type: String!
    description: String!
    timestamp: DateTime!
}

input CreatePostInput {
    title: String! @rules(apply: ["required", "min:3"])
    content: String! @rules(apply: ["required", "min:10"])
    tags: [ID!]
}

input UpdatePostInput {
    title: String @rules(apply: ["min:3"])
    content: String @rules(apply: ["min:10"])
    tags: [ID!]
}

input RegisterInput {
    name: String!
    email: String!
    password: String!
}

type AuthPayload {
    token: String!
    user: User!
}
